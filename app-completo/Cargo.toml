[package]
name = "braniac"
version = "2.0.0"
description = "B.R.A.N.I.A.C - o Braniac completo numa janela (Tauri 2)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

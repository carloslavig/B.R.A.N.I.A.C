<style>

#app{display:grid;grid-template-columns:1fr 340px;height:100vh}

#stage{position:relative;min-height:0;overflow:auto;background:radial-gradient(1200px 600px at 30% 0%,#111a2c,#0b0f17)}
canvas{width:100%;height:100%;min-height:640px;display:block}
header{position:absolute;left:14px;top:10px;pointer-events:none;z-index:3}
#eco{position:absolute;right:14px;bottom:12px;z-index:3;background:rgba(18,24,38,.9);color:#8a96b0;border:1px solid #243049;border-radius:99px;padding:4px 12px;font-size:11px;cursor:pointer}

#demo{position:absolute;right:14px;top:10px;background:var(--wn);color:#111;font-weight:700;padding:3px 10px;border-radius:99px;font-size:12px;display:none}
aside{background:var(--pn);border-left:1px solid var(--ln);overflow:auto;padding:14px}
h3{margin:14px 0 6px;font-size:11px;letter-spacing:.12em;color:var(--mu);text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.card{background:var(--pn2);border:1px solid var(--ln);border-radius:10px;padding:8px 10px}
.card b{display:block;font-size:20px}.card small{color:var(--mu)}
.row{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid #1b2438}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--mu)}
.ok{background:var(--ok)}.er{background:var(--er)}.wn{background:var(--wn)}
#aut{display:flex;align-items:center;gap:8px;justify-content:space-between}
.badge{padding:2px 10px;border-radius:99px;font-weight:700;font-size:12px}
.b-on{background:#06402c;color:var(--ok)}.b-off{background:#2a2f3d;color:var(--mu)}
#det{position:absolute;left:14px;bottom:14px;width:min(380px,calc(100% - 28px));max-height:55%;overflow:auto;background:rgba(18,24,38,.96);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;display:none;box-shadow:0 10px 30px #0008}
#det h2{margin:0 0 2px;font-size:17px}#det .x{position:absolute;right:10px;top:8px;cursor:pointer;color:var(--mu);background:none;border:0;font-size:18px}
#det.wide{width:min(560px,calc(100% - 28px));max-height:70%}
.logpc{margin:8px 0 0;background:#0a0f1c;border:1px solid #243049;border-radius:8px;padding:10px;font:12px/1.5 Consolas,ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;color:#cbd5e1}
.jk{color:#7dd3fc}.js{color:#a7f3d0}.jn{color:#fb923c}
#det p{margin:4px 0}.nd{color:var(--mu);font-style:italic}
.conv{font-size:12px;color:var(--mu)}.conv b{color:var(--tx)}
#predio{position:absolute;right:12px;top:54px;z-index:4;width:158px;border:1px solid #2a3858;border-radius:12px;overflow:hidden;background:rgba(14,20,34,.92) linear-gradient(90deg,transparent 12px,#2a3858 12px,#2a3858 14px,transparent 14px)}#predio .pa{display:block;width:100%;text-align:left;background:transparent;color:#aab4cc;border:0;border-bottom:1px solid #1f2a45;padding:8px 10px 8px 26px;cursor:pointer;font:600 12px system-ui}#predio .pa:last-of-type{border-bottom:0}#predio .pa small{display:block;font-weight:400;color:#6f7b95;font-size:10px}#predio .pa.on{background:rgba(30,50,90,.7);color:#fff}#pcab{position:absolute;left:6px;width:14px;height:16px;border-radius:4px;background:#fbbf24;top:8px;transition:top .7s cubic-bezier(.5,0,.3,1);box-shadow:0 0 8px #fbbf24aa;pointer-events:none}#c{transition:opacity .22s}
#stage.fch{overflow:hidden}#fachada{position:absolute;inset:0;z-index:5;display:none;opacity:0;background:#0b0f17}#fc{position:absolute;left:0;top:0;width:100%;height:100%;min-height:0}

</head>

    <button id="regx" style="display:none;position:absolute;left:200px;top:134px;z-index:4;background:rgba(18,24,38,.92);color:#e6ebf5;border:1px solid #a78bfa;border-radius:99px;padding:6px 14px;font:600 12px system-ui;cursor:pointer">Registro Aliado ↔ Braniac</button>

    <div id="regp" class="regp" style="display:none;position:absolute;left:14px;top:172px;bottom:50px;width:min(380px,92%);z-index:5;background:rgba(10,14,24,.96);border:1px solid #2a3858;border-radius:12px;padding:10px;overflow:auto;font:12px system-ui;color:#e6ebf5"></div>
    <button id="voltarp" onclick="window.fachadaVoltar()">&larr; Voltar ao prédio</button>
  </div>
  <aside>

</div>
<script>
"use strict";
var DEMO=/[?&]demo=1/.test(location.search), snap=null, selecionado=null, t0=performance.now();
var ROOMS=[ // um bloco (sala) por modulo; o Jarvis fica no centro do andar. g = [coluna, linha] na grade 3x3
 {n:"Gerência",a:["Jarvis","Claudinho"],c:"#38bdf8",g:[1,1]},{n:"Finanças",a:["Cofre","Vaquinha","Valério"],c:"#34d399",g:[0,0]},{n:"Operação",a:["Sultão","Ilhéu","Monza","Lupa"],c:"#fb923c",g:[1,0]},
 {n:"Engenharia",a:["Forja","Ada"],c:"#a78bfa",g:[2,0]},{n:"Família",a:["Alma"],c:"#f472b6",g:[0,1]},{n:"Exército",a:["Cabo Tito"],c:"#a3a380",g:[2,1]},
 {n:"Rotina",a:["Compasso"],c:"#fbbf24",g:[0,2]},{n:"Qualidade",a:["Tino"],c:"#2dd4bf",g:[1,2]},{n:"Entradas",a:["Correio","Garimpeiro","Nando","Zelo"],c:"#60a5fa",g:[2,2]}];
var COR={ocioso:"#8a96b0",analisando:"#38bdf8",planejando:"#818cf8",executando:"#34d399",consultando:"#22d3ee",aguardando_autorizacao:"#fbbf24",aguardando_servico:"#fb923c",concluido:"#4ade80",erro:"#f87171",desconectado:"#4b5563"};
var CURTO={aguardando_autorizacao:"Aguarda OK",consultando:"Consultando",executando:"Executando",aguardando_servico:"Aguarda serviço"};
var ROT={ocioso:"Ocioso",analisando:"Analisando",planejando:"Planejando",executando:"Executando tarefa",consultando:"Consultando outro agente",aguardando_autorizacao:"Aguardando autorização humana",aguardando_servico:"Aguardando serviço externo",concluido:"Concluído",erro:"Erro",desconectado:"Desconectado"};
function hue(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ago(ts){if(!ts)return "dado não disponível";var s=Math.max(0,Date.now()/1000-ts);if(s<90)return "agora há pouco";if(s<3600)return "há "+Math.round(s/60)+" min";if(s<86400)return "há "+Math.round(s/3600)+" h";return "há "+Math.round(s/86400)+" d"}
function demoSnap(){ // DADOS SIMULADOS (so com ?demo=1): estados rotativos para ver as animacoes
  var PESOS=["ocioso","ocioso","ocioso","executando","ocioso","consultando","aguardando_autorizacao","ocioso","erro","desconectado","ocioso","planejando"];
  var nomes=["Jarvis","Claudinho","Compasso","Sultão","Ilhéu","Alma","Forja","Ada","Cofre","Vaquinha","Garimpeiro","Correio","Cabo Tito","Tino","Valério","Nando","Monza","Zelo"],ests=PESOS,k=Math.floor(Date.now()/30000),c=Math.floor(Date.now()/26000);
  return {ts:Date.now()/1000,simulado:true,total:nomes.length,agentes:nomes.map(function(n,i){var e=ests[(i*5+k)%ests.length];return{nome:n,exibir:n==="Alma"?"A.L.M.A.":n,especialidade:"(simulado)",estado:e,motivo:"simulado",ultima_atividade:Date.now()/1000-i*40,tarefa:"tarefa simulada",atividades:[],avisos:[]}}),
   conversa:[{id:c*10+1,ts:0,de:"Jarvis",para:"Alma",tipo:"pedido",texto:"(simulado) consulta sobre família"},{id:c*10+2,ts:0,de:"Alma",para:"Cabo Tito",tipo:"pedido",texto:"(simulado) envolve o Exército também"},{id:c*10+3,ts:0,de:"Cabo Tito",para:"Alma",tipo:"resposta",texto:"(simulado) tenho 3 fatos"},{id:c*10+4,ts:0,de:"Alma",para:"Jarvis",tipo:"resposta",texto:"(simulado) juntei 5 fatos"}],contagem:{},autonomia:{armada:false},servicos:[{nome:"Braniac",ok:true}],provedores:[],recursos:{},nota:"Modo demonstração: nada aqui é real."}}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function dia(){var d=new Date(),h=d.getHours()+d.getMinutes()/60;return Math.max(0,Math.sin(Math.PI*(h-6)/12))} // 0 = noite, 1 = meio-dia
function mix(a,b,t){return Math.round(a+(b-a)*t)}
function cor3(c1,c2,t){return"rgb("+mix(c1[0],c2[0],t)+","+mix(c1[1],c2[1],t)+","+mix(c1[2],c2[2],t)+")"}
function sombra(g,x,y,rx,ry,a){g.fillStyle="rgba(0,0,0,"+(a||.28)+")";g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill()}
function planta(g,x,y,s,t){s=s||1;sombra(g,x,y+9*s,9*s,3*s,.3);g.fillStyle="#6b3f22";rr(g,x-6*s,y,12*s,10*s,3);g.fill();g.fillStyle="#8a5230";g.fillRect(x-6*s,y,12*s,3*s);
  var bal=Math.sin((t||0)*1.4+x)*1.5;g.fillStyle="#15803d";[[-6,-3,-.5],[6,-3,.5],[0,-9,0],[-3,-7,-.25],[3,-7,.25]].forEach(function(p){g.save();g.translate(x+p[0]*s,y+p[1]*s);g.rotate(p[2]+bal*.03);g.beginPath();g.ellipse(0,-4*s,3.2*s,7*s,0,0,7);g.fill();g.restore()});
  g.fillStyle="#22c55e";[[-4,-6],[4,-6],[0,-12]].forEach(function(p){g.beginPath();g.ellipse(x+p[0]*s+bal*.2,y+p[1]*s,2.2*s,4.5*s,0,0,7);g.fill()})}
// ============ PESSOAS REALISTAS (perfil, proporcao adulta) ============
var PAPEL={Jarvis:"terno",Claudinho:"terno",Cofre:"blazer","Valério":"blazer",Compasso:"blazer",Correio:"headset",Nando:"headset",Tino:"oculos",Forja:"moletom",Ada:"moletom",Alma:"cardigan","Cabo Tito":"farda","Sultão":"colete",Garimpeiro:"colete"};
function hs(c,d){return"hsl("+c[0]+","+c[1]+"%,"+Math.max(4,c[2]+(d||0))+"%)"}
function membro(g,pts,cor,larg){g.lineCap="round";g.lineJoin="round";g.strokeStyle=cor;g.lineWidth=larg;g.beginPath();g.moveTo(pts[0],pts[1]);for(var i=2;i<pts.length;i+=2)g.lineTo(pts[i],pts[i+1]);g.stroke()}
function pessoa3(g,a,ch,t){
  var e=ch.visitando?"consultando":a.estado,cor=e?COR[e]:"#6b7280",h=hue(a.nome),papel=PAPEL[a.nome]||"casual",pose=ch.pose,anda=ch.andando,
    sentado=(pose==="mesa"||pose==="sofa")&&!anda,dim=e==="desconectado"?.55:1,dir=pose==="mesa"?1:(ch.dir||1),
    ton=18+h%20,pele="hsl("+ton+",42%,"+(48+(h%5)*5)+"%)",peleD="hsl("+ton+",40%,"+(38+(h%5)*5)+"%)",
    cab="hsl("+((h*7)%40+8)+",38%,"+(10+(h%4)*6)+"%)",comprido=(h%3===0)&&papel!=="farda"&&papel!=="terno",
    camA=papel==="terno"?[222,34,19]:papel==="blazer"?[218,24,29]:papel==="farda"?[88,22,29]:papel==="moletom"?[h,28,34]:papel==="cardigan"?[(h+30)%360,34,38]:[h,52,40+(h%3)*5],
    calA=papel==="farda"?[88,22,22]:(papel==="terno"||papel==="blazer")?[224,31,12]:[(h+200)%360,18,22+(h%3)*4],
    w=Math.sin(t*9+ch.fase),dig=e==="executando"||e==="analisando"||e==="planejando"||e==="consultando",resp=Math.sin(t*1.8+ch.fase)*.5,
    quad=sentado?(pose==="sofa"?-12:-11):-22,lean=sentado?(dig&&pose==="mesa"?.16:.04):(anda?.07:0),bob=anda?Math.abs(w)*1.5:0,hy=quad-bob,
    sx=Math.sin(lean)*16,sy=hy-Math.cos(lean)*16-resp,SH="#0f172a";
  g.globalAlpha=dim;g.fillStyle=cor;g.globalAlpha=dim*.2;g.beginPath();g.ellipse(0,0,17,6,0,0,7);g.fill();g.globalAlpha=dim;sombra(g,0,0,11,3.6,.34);
  g.save();g.scale(dir,1);

  function perna(p,d){membro(g,p,hs(calA,d),5.6);g.fillStyle=SH;rr(g,p[p.length-2]-2.2,-3,8,3.6,1.8);g.fill()}
  if(sentado){perna([-1,hy,9,hy+.5,9.6,-2],-6);perna([1,hy,11,hy,11.6,-2],0)}
  else if(anda){var sw=w*7;perna([0,hy,-sw*.5,hy+11,-sw,-2],-6);perna([0,hy,sw*.5,hy+11,sw,-2],0)}
  else{perna([-1.6,hy,-1,hy+11,-1.4,-2],-6);perna([1.4,hy,2,hy+11,2.2,-2],0)}
  // braco do fundo
  function bracos(far){var dx=far?-1.8:0,d=far?-7:0,c=hs(camA,d),P0=[sx+dx,sy+2],m=far?-1:1,cot,mao;
    if(sentado&&pose==="mesa"){var ty=dig?Math.sin(t*22+(far?1.7:0)+ch.fase)*1.3:0;cot=[sx+2+dx,sy+10];mao=[sx+13+dx,sy+(dig?6:9)+ty]}
    else if(sentado){cot=[sx+3+dx,sy+9];mao=[sx+9+dx,sy+13]}
    else if(anda){var sw2=-w*6*m;cot=[sx+sw2*.5+dx,sy+9];mao=[sx+sw2+dx,sy+17]}
    else if(pose==="pong"&&!far){cot=[sx+7,sy+6];mao=[sx+13,sy+2+Math.sin(t*8)*5]}
    else if(pose==="cafe"&&!far){cot=[sx+4,sy+9];mao=[sx+9,sy+2]}
    else if(pose==="papo"){var gg=Math.sin(t*3+ch.fase+(far?2:0));cot=[sx+4+dx,sy+8];mao=[sx+10+gg*3+dx,sy+5+gg*2]}

    if(!far&&pose==="cafe"){g.fillStyle="#f8fafc";rr(g,mao[0]-1,mao[1]-5,5,6.5,1.5);g.fill();g.fillStyle="rgba(255,255,255,.5)";g.fillRect(mao[0]+.4,mao[1]-9-((t*10)%5),1.2,3)}
    if(!far&&pose==="pong"){g.fillStyle="#b91c1c";g.beginPath();g.arc(mao[0]+4,mao[1]-2,5,0,7);g.fill();g.fillStyle="#fafafa";g.beginPath();g.arc(mao[0]+13+Math.sin(t*8)*3,mao[1]-6,1.8,0,7);g.fill()}}

function corNoite(hex, noite) {
    var n = Math.max(0, Math.min(1, noite || 0));
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    var f = 1 - n * 0.38;
    return "rgb(" + Math.round(r * f) + "," +
        Math.round(g * f) + "," + Math.round(b * f) + ")";
}

function terracoVerde(g, xl, xr, y, seed, noite, t) {
    var w = xr - xl;
    var i, r, px, py, sway, cores, c;

    cores = ["#166534", "#22c55e", "#4ade80", "#86efac"];

    g.save();

    // Floreira
    g.fillStyle = "#365b43";
    g.fillRect(xl, y - 5, w, 7);

    g.fillStyle = "#593e2b";
    g.fillRect(xl, y + 2, w, 5);

    // Arbustos
    for (i = 0; i < w / 5; i++) {
        r = rnd(seed + i * 7);
        px = xl + r * w;
        py = y - 8 - rnd(seed + i * 13) * 10;
        c = cores[Math.floor(rnd(seed + i * 19) * 4)];

        g.beginPath();
        g.arc(px, py, 3 + rnd(seed + i * 23) * 5, 0, Math.PI * 2);
        g.fillStyle = corNoite(c, noite);
        g.fill();
    }

    // Flores
    for (i = 0; i < w / 20; i++) {
        px = xl + rnd(seed + i * 31 + 100) * w;
        py = y - 12 - rnd(seed + i * 37 + 100) * 8;

        g.beginPath();
        g.arc(px, py, 2, 0, Math.PI * 2);
        g.fillStyle = corNoite(
            ["#f472b6", "#fbbf24", "#fb7185"][i % 3], noite
        );
        g.fill();
    }

    // Trepadeiras caindo pela fachada
    for (i = 0; i < w / 35; i++) {
        px = xl + rnd(seed + i * 41 + 200) * w;
        sway = Math.sin(t * 1.2 + i) * 3;
        var len = 15 + rnd(seed + i * 47 + 200) * 30;

        g.beginPath();
        g.moveTo(px, y);
        g.quadraticCurveTo(
            px + sway + 5, y + len * 0.5,
            px + sway, y + len
        );
        g.strokeStyle = corNoite("#22c55e", noite);
        g.lineWidth = 1.4;
        g.stroke();

        // Folhas da trepadeira
        for (var j = 0; j < len; j += 9) {
            var fy = y + j;
            var fx = px + sway * (j / len);

            g.beginPath();
            g.ellipse(fx + 4, fy, 4, 2, -0.5, 0, Math.PI * 2);
            g.fillStyle = corNoite(
                j % 2 ? "#4ade80" : "#166534", noite
            );
            g.fill();
        }
    }

    g.restore();
}

function arvoreTerraco(g, x, y, s, seed, t) {
    var i, a, cores = ["#166534", "#22c55e", "#4ade80"];

    g.save();
    g.translate(x, y);
    g.scale(s, s);

    // Tronco
    g.beginPath();
    g.moveTo(-3, 0);
    g.lineTo(-2, -35);
    g.lineTo(3, -48);
    g.lineTo(5, 0);
    g.fillStyle = "#79502f";
    g.fill();

    // Galhos
    g.strokeStyle = "#79502f";
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(0, -28);
    g.lineTo(-17, -45);
    g.moveTo(2, -35);
    g.lineTo(18, -53);
    g.stroke();

    // Copa
    for (i = 0; i < 18; i++) {
        a = rnd(seed + i * 11);
        var px = (a - 0.5) * 48;
        var py = -48 - rnd(seed + i * 17) * 22;

        g.beginPath();
        g.arc(px + sway, py, 9 + rnd(seed + i * 23) * 7,
            0, Math.PI * 2);
        g.fillStyle = cores[i % 3];
        g.fill();
    }

    g.restore();
}

function jardimVertical(g, x, y, w, h, seed, t) {
    var cols = Math.max(2, Math.floor(w / 10));
    var rows = Math.max(2, Math.floor(h / 10));
    var cores = ["#166534", "#22c55e", "#4ade80", "#86efac"];
    var i, j, px, py, sway;

    g.save();

    // Base do painel
    g.fillStyle = "#294b3b";
    g.fillRect(x, y, w, h);

    // Folhagem
    for (i = 0; i < cols; i++) {
        for (j = 0; j < rows; j++) {
            if (rnd(seed + i * 101 + j * 17) > 0.9) continue;

            px = x + i * (w / cols) + 3;
            py = y + j * (h / rows) + 3;
            sway = Math.sin(t + i + j) * 1.2;

            g.beginPath();
            g.ellipse(px + sway, py, 3.5, 4.5,
                rnd(seed + i * 31 + j * 7), 0, Math.PI * 2);
            g.fillStyle = cores[
                Math.floor(rnd(seed + i * 43 + j * 13) * 4)
            ];
            g.fill();

            // Flores ocasionais
            if (rnd(seed + i * 67 + j * 29) > 0.94) {
                g.beginPath();
                g.arc(px, py - 2, 2, 0, Math.PI * 2);
                g.fillStyle = ["#f472b6", "#fbbf24", "#fb7185"][
                    (i + j) % 3
                ];
                g.fill();
            }
        }
    }

    g.restore();
}

function painelSolar(g, x, y, w, h) {
    g.save();

    // Estrutura inclinada
    g.beginPath();
    g.moveTo(x, y + h * 0.2);
    g.lineTo(x + w, y);
    g.lineTo(x + w, y + h);
    g.lineTo(x, y + h * 1.2);
    g.closePath();

    g.fillStyle = "#123b60";
    g.fill();

    // Contorno
    g.strokeStyle = "#8db9d4";
    g.lineWidth = 1.5;
    g.stroke();

    // Células solares
    g.beginPath();

    for (var i = 1; i < 5; i++) {
        var px = x + w * i / 5;
        g.moveTo(px, y + h * 0.2 * (1 - i / 5));
        g.lineTo(px, y + h * 1.2 - h * i / 5);
    }

    for (var j = 1; j < 3; j++) {
        var py = y + h * j / 3;
        g.moveTo(x, py + h * 0.2);
        g.lineTo(x + w, py);
    }

    g.strokeStyle = "#4b91c2";
    g.lineWidth = 0.8;
    g.stroke();

    // Reflexo
    g.beginPath();
    g.moveTo(x + 5, y + h * 0.25);
    g.lineTo(x + w * 0.45, y + h * 0.16);
    g.lineTo(x + w * 0.28, y + h * 0.4);
    g.closePath();
    g.fillStyle = "rgba(180,225,255,0.16)";
    g.fill();

    g.restore();
}

function turbina(g, x, y, s, t) {
    g.save();
    g.translate(x, y);
    g.scale(s, s);

    // Mastro
    g.beginPath();
    g.moveTo(0, 0);
    g.lineTo(0, -38);
    g.strokeStyle = "#b8c8cc";
    g.lineWidth = 2.5;
    g.stroke();

    // Cubo central
    g.translate(0, -38);

    // Três pás giratórias
    g.rotate(t * 1.8);

    for (var i = 0; i < 3; i++) {
        g.rotate(Math.PI * 2 / 3);

        g.beginPath();
        g.moveTo(0, 0);
        g.quadraticCurveTo(5, -9, 3, -29);
        g.lineTo(0, -34);
        g.quadraticCurveTo(-3, -12, 0, 0);
        g.closePath();

        g.fillStyle = "#d5e5e8";
        g.fill();

        g.strokeStyle = "#8baeb8";
        g.lineWidth = 0.8;
        g.stroke();
    }

    // Centro
    g.beginPath();
    g.arc(0, 0, 3.5, 0, Math.PI * 2);
    g.fillStyle = "#fbbf24";
    g.fill();

    g.restore();
}

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis · Voz</title>
<meta name="color-scheme" content="dark">
<style>
/* Mesmo visual do painel.html. A versao antiga esta em hud.classico.html. */
@font-face{font-family:"Instrument Sans";font-weight:400 700;font-display:swap;src:url(/claw/fonts/instrument-sans-latin.woff2) format("woff2")}
:root{
 --bg:#0a1126;--bg2:#101b3a;--glow:rgba(201,102,38,.30);--glow2:rgba(120,60,30,.22);
 --glass:rgba(255,255,255,.045);--glass-hover:rgba(255,255,255,.08);--hair:rgba(255,255,255,.085);--hair-strong:rgba(255,255,255,.16);
 --text:#c5cbe0;--text-strong:#f5f6fb;--muted:#8d95b0;
 --accent:#ff5c5c;--accent-hover:#ff7a7a;--accent-2:#d9453a;--accent-subtle:rgba(255,92,92,.16);
 --ok:#4ade80;--warn:#fbbf24;--danger:#f87171;
 --font:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{color:var(--text);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased;background-color:var(--bg);overflow:hidden;
 background-image:radial-gradient(900px 620px at 100% 100%,var(--glow),transparent 70%),radial-gradient(700px 500px at 82% 108%,var(--glow2),transparent 70%),linear-gradient(160deg,var(--bg2),var(--bg) 62%);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100vh;height:100dvh;display:grid;grid-template-columns:minmax(200px,260px) minmax(0,1fr) minmax(200px,260px);gap:18px;padding:20px 22px;padding-bottom:max(20px,env(safe-area-inset-bottom));padding-top:max(20px,env(safe-area-inset-top));overflow:auto}
.col{display:flex;flex-direction:column;gap:12px;align-content:start}
.card{background:var(--glass);border:1px solid var(--hair);border-radius:14px;padding:12px 14px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);min-width:0}
.card h3{margin:0 0 4px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card .v{font-size:20px;font-weight:700;color:var(--text-strong);line-height:1.2}
.card .s{font-size:12px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tags em{font-style:normal;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--hair);color:var(--muted)}
.tags em.on{color:var(--text-strong);border-color:rgba(74,222,128,.45);background:rgba(74,222,128,.10)}
.sim{display:none;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--warn);border:1px solid rgba(251,191,36,.5);border-radius:99px;padding:1px 8px;margin-left:6px}
body.demo .sim{display:inline-block}
.centro{display:flex;flex-direction:column;align-items:center;min-height:0;gap:10px;padding-top:2vh}
.marca{display:flex;align-items:center;gap:10px;color:var(--text-strong);font-weight:700}
.logo{width:28px;height:28px;border-radius:9px;background:linear-gradient(145deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 12px rgba(217,69,58,.35)}
.orbe{position:relative;width:clamp(150px,26vh,230px);aspect-ratio:1;margin:6px 0 2px}
.orbe canvas{position:absolute;inset:-30%;width:160%;height:160%;pointer-events:none}
.estado{text-align:center}
.estado b{display:block;font-size:22px;color:var(--text-strong);font-weight:700}
.estado span{color:var(--muted);font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--hair);background:var(--glass);color:var(--text)}
.chip svg{width:14px;height:14px}
.chip.off{color:var(--danger);border-color:rgba(248,113,113,.45);background:rgba(248,113,113,.10)}
.chip.on{color:var(--ok);border-color:rgba(74,222,128,.4)}
.chip.mudo{color:var(--warn);border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.08)}
.nivel{width:140px;height:4px;border-radius:99px;background:var(--hair);overflow:hidden}.nivel i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s}
.leg{min-height:22px;text-align:center;color:var(--text-strong);font-size:15px;max-width:560px;overflow-wrap:anywhere}
.conv{width:100%;max-width:560px;display:flex;flex-direction:column;gap:8px}
.bal{border-radius:14px;padding:8px 12px;border:1px solid var(--hair);background:var(--glass);max-width:92%;overflow-wrap:anywhere}
.bal small{display:block;font-size:11px;color:var(--muted)}
.bal.eu{align-self:flex-end;background:var(--accent-subtle);border-color:rgba(255,92,92,.3)}
.bal.j{align-self:flex-start}
.bal.vazio{align-self:center;color:var(--muted);background:none;border:0}
.hist{display:none;width:100%;max-width:560px;flex-direction:column;gap:6px;max-height:34vh;overflow:auto}
.hist.aberto{display:flex}
.link{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;padding:4px}
.botoes{display:grid;grid-template-columns:repeat(4,auto);gap:8px;margin-top:6px;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--hair-strong);background:var(--glass);color:var(--text-strong);font-weight:600;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--glass-hover)}.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px;flex:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1a0b0a}.btn.pri:hover{background:var(--accent-hover)}
.btn.ativo{border-color:var(--warn);background:rgba(251,191,36,.14);color:var(--warn)}
.btn:focus-visible{outline:2px solid var(--accent-hover);outline-offset:2px}
.conf{display:none;align-items:center;gap:8px;font-size:13px;color:var(--text-strong);margin-top:4px}
.conf.aberto{display:flex}
@media (max-width:900px){
 body{overflow:auto}
 #app{display:flex;flex-direction:column;height:auto;min-height:100dvh;padding:12px;gap:12px;overflow:visible}
 .centro{order:1;padding-top:0}.col.esq{order:2}.col.dir{order:3}
 .orbe{width:130px}
 .col{flex-direction:row;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px}
 .col .card{flex:0 0 70%;scroll-snap-align:start}
 .botoes{grid-template-columns:1fr 1fr;width:100%}
 .btn{padding:0 8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
 <div class="col esq">
  <div class="card"><h3>Hora<span class="sim">SIMULADO</span></h3><div class="v" id="hora">—</div><div class="s" id="data"></div></div>
  <div class="card"><h3>IAs disponíveis</h3><div class="v" id="ias">—</div><div class="tags" id="iasT"></div></div>
  <div class="card"><h3>Conselho de IAs</h3><div class="v" id="cons">—</div><div class="tags" id="consT"></div></div>
 </div>

 <div class="centro">
  <div class="marca"><span class="logo">J</span><span id="nome">Jarvis</span></div>
  <div class="orbe"><canvas id="orbe" width="400" height="400"></canvas></div>
  <div class="estado"><b id="est">Dormindo</b><span id="estSub"></span></div>
  <div class="chips"><span class="chip" id="chMic"></span><span class="chip" id="chVoz"></span></div>
  <div class="nivel" aria-hidden="true"><i id="nivel"></i></div>
  <div class="leg" id="leg" aria-live="polite"></div>
  <div class="conv" id="conv"></div>
  <button class="link" id="bVer" type="button">Ver conversa</button>
  <div class="hist" id="hist"></div>
  <div class="botoes">
   <button class="btn pri" id="bAcordar" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Acordar</button>
   <button class="btn" id="bDescansar" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>Descansar</button>
   <button class="btn" id="bMudo" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l4 6M21 9l-4 6"/></svg><span>Silenciar</span></button>
   <button class="btn" id="bMic" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span>Desligar microfone</span></button>
  </div>
  <div class="conf" id="conf">Desligar o microfone? O Jarvis deixa de ouvir.<button class="btn" id="cSim" type="button">Desligar</button><button class="btn" id="cNao" type="button">Cancelar</button></div>
 </div>

 <div class="col dir">
  <div class="card"><h3>Autonomia</h3><div class="v" id="aut">—</div><div class="s" id="autS"></div></div>
  <div class="card"><h3>Habilidades</h3><div class="v" id="hab">—</div><div class="s" id="habS"></div></div>
  <div class="card"><h3>Projetos</h3><div class="v" id="proj">—</div><div class="s" id="projS">projetos / conversas</div></div>
  <div class="card"><h3>Sistema</h3><div class="v" id="sis">—</div><div class="s" id="sisS"></div><div class="s" id="sisT"></div></div>
 </div>
</div>
<script>
const $=s=>document.querySelector(s);
const DEMO=/[?&]demo=1/.test(location.search);
if(DEMO)document.body.classList.add('demo');
let NOME='Jarvis';
// 'me mostra' por voz (15/11): o Jarvis pede uma tela; dentro do B.R.A.N.I.A.C 1 troca a aba, sozinha troca a pagina. Uma vez por id.
let telaVista=0;
function telaPedida(t){if(!t||t.id<=telaVista)return;telaVista=t.id;try{if(parent!==window&&parent.abrirTela){parent.abrirTela(t.url);return}}catch(e){}location.href=t.url}
const D={estado:'dormindo',atividade:'idle',entrada:0,fala:0,historico:[],ultimo:'',mudo:{}};
const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const sufixo=()=>DEMO?' (simulado)':'';
async function j(u,b){const r=await fetch(u,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});return r.json()}
if(!DEMO)fetch('/api/b2/aparencia').then(r=>r.json()).then(a=>{if(a.nome){NOME=a.nome;$('#nome').textContent=a.nome}}).catch(()=>{});

// ---- estado em texto: dormindo, silenciado e microfone desligado nunca se confundem ----
function chave(){
 if(D.estado==='parada')return 'parada';
 if(D.estado==='acordado'&&D.atividade!=='idle')return D.atividade;
 return D.estado;
}
const TEXTO={
 dormindo:['Dormindo','Microfone ligado, aguardando: diga “'+'NOME'+', tá acordado?”'],
 acordado:['Acordado','Estou ouvindo'],
 parada:['Microfone desligado','Ligue o microfone para falar'],
 ouvindo:['Ouvindo você…','Pode falar'],
 pensando:['Pensando…','Consultando o banco e as IAs'],
 falando:['Falando','']};
const ICO_MIC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const ICO_MIC_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M3 3l18 18"/></svg>';
const ICO_VOL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 8a5 5 0 0 1 0 8"/></svg>';
const ICO_MUDO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>';
function hm(){return new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
let ultimoRender='';
function render(){
 const k=chave(),t=TEXTO[k]||[k,''],mudo=!!(D.mudo||{}).mudo,parada=D.estado==='parada';
 $('#est').textContent=t[0];
 $('#estSub').textContent=k==='dormindo'?'Microfone ligado, aguardando: diga “'+NOME+', tá acordado?”':t[1];
 $('#chMic').className='chip '+(parada?'off':'on');$('#chMic').innerHTML=(parada?ICO_MIC_OFF:ICO_MIC)+(parada?'Microfone desligado':'Microfone ligado');
 $('#chVoz').className='chip '+(mudo?'mudo':'');$('#chVoz').innerHTML=(mudo?ICO_MUDO:ICO_VOL)+(mudo?'Voz silenciada':'Voz ativa');
 $('#nivel').style.width=Math.min(100,(D.entrada||0)*400)+'%';
 $('#bMic').lastElementChild.textContent=parada?'Ligar microfone':'Desligar microfone';
 $('#bMudo').lastElementChild.textContent=mudo?'Voltar a falar':'Silenciar';$('#bMudo').classList.toggle('ativo',mudo);
 $('#bAcordar').disabled=parada;$('#bDescansar').disabled=parada;
 $('#bAcordar').style.opacity=$('#bDescansar').style.opacity=parada?.5:1;
 $('#leg').textContent=k==='ouvindo'?'Ouvindo você… '+(D.ultimo||''):(k==='pensando'?'Pensando…':'');
 const h=D.historico||[],ur=a=>[...h].reverse().find(x=>x[0]===a),uu=ur('u'),uj=ur('j'),hr=hm();
 const sig=JSON.stringify([uu,uj]);
 if(sig!==ultimoRender){ultimoRender=sig;
  $('#conv').innerHTML=uu||uj?((uu?'<div class="bal eu"><small>Você · '+hr+'</small>'+esc(uu[1])+'</div>':'')+(uj?'<div class="bal j"><small>'+esc(NOME)+' · '+hr+'</small>'+esc(uj[1])+'</div>':'')):'<div class="bal vazio">A conversa por voz aparece aqui.</div>';
  $('#hist').innerHTML=h.slice(-6).map(x=>'<div class="bal '+(x[0]==='u'?'eu':'j')+'">'+esc(x[1])+'</div>').join('')}
}
$('#bVer').onclick=()=>{const a=$('#hist').classList.toggle('aberto');$('#bVer').textContent=a?'Ocultar conversa':'Ver conversa'};

// ---- orbe: canvas leve, ~30 fps, pausa quando a aba esta escondida ----
const cv=$('#orbe'),g=cv.getContext('2d'),RED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const V={ent:0,fala:0,giro:0,br:.35};let ult=0;
function orbe(t){
 requestAnimationFrame(orbe);
 if(document.hidden||t-ult<33)return;ult=t;
 const k=chave(),mudo=!!(D.mudo||{}).mudo,parada=k==='parada',dorm=k==='dormindo';
 V.ent+=((D.entrada||0)-V.ent)*.35;V.fala+=((D.fala||0)-V.fala)*.3;
 const som=k==='ouvindo'?Math.min(1,V.ent*4):(k==='falando'?Math.min(1,V.fala||.5+.3*Math.sin(t/160)):0);
 let alvo=parada?.12:dorm?.3+.12*Math.sin(t/1400):k==='acordado'?.8:k==='pensando'?.7:.75+som*.25;
 if(mudo)alvo*=.55;if(RED)alvo=Math.max(.3,alvo);
 V.br+=(alvo-V.br)*.1;V.giro+=RED?0:(k==='pensando'?.05:.006);
 const W=400,c=W/2,r=W*.2125;g.clearRect(0,0,W,W);
 const hal=g.createRadialGradient(c,c,r*.6,c,c,r*2.2);hal.addColorStop(0,'rgba(255,92,92,'+.28*V.br+')');hal.addColorStop(1,'rgba(255,92,92,0)');
 g.fillStyle=hal;g.beginPath();g.arc(c,c,r*2.2,0,7);g.fill();
 // ondas (volume do microfone / pulsos da fala)
 for(let n=0;n<3;n++){const rr=r*(1.18+n*.2)+som*r*.22*(n+1)/3,a=(.22-n*.06)*(parada?0:V.br+som);
  g.beginPath();g.arc(c,c,rr,0,7);g.lineWidth=1.5;g.strokeStyle='rgba(255,140,120,'+Math.max(0,a)+')';g.stroke()}
 // esfera
 const R=r*(1+som*.06);
 const gr=g.createLinearGradient(c-R,c-R,c+R,c+R);
 if(k==='pensando'){const a=V.giro,cx=Math.cos(a)*R,cy=Math.sin(a)*R;const lg=g.createLinearGradient(c-cx,c-cy,c+cx,c+cy);lg.addColorStop(0,'#ff5c5c');lg.addColorStop(1,'#1b2a5c');g.fillStyle=lg}
 else{gr.addColorStop(0,'rgba(255,'+Math.round(92+60*V.br)+',92,'+(.55+.4*V.br)+')');gr.addColorStop(.55,'rgba(40,58,120,.95)');gr.addColorStop(1,'rgba(14,24,56,1)');g.fillStyle=gr}
 g.beginPath();g.arc(c,c,R,0,7);g.fill();
 g.lineWidth=1.5;g.strokeStyle='rgba(255,255,255,'+(.12+.15*V.br)+')';g.stroke();
 // anel fino girando
 g.beginPath();g.arc(c,c,R*1.08,V.giro,V.giro+2.2);g.lineWidth=2;g.strokeStyle='rgba(255,120,110,'+(.25+.4*V.br)+')';g.stroke();
 // brilho especular
 const sp=g.createRadialGradient(c-R*.35,c-R*.4,2,c-R*.35,c-R*.4,R*.6);sp.addColorStop(0,'rgba(255,255,255,.22)');sp.addColorStop(1,'rgba(255,255,255,0)');
 g.fillStyle=sp;g.beginPath();g.arc(c,c,R,0,7);g.fill();
 // indicador de mudo / microfone desligado dentro do orbe
 if(parada||mudo){g.strokeStyle=parada?'rgba(248,113,113,.9)':'rgba(251,191,36,.9)';g.lineWidth=4;g.lineCap='round';g.beginPath();g.moveTo(c-R*.4,c-R*.4);g.lineTo(c+R*.4,c+R*.4);g.stroke()}
}
requestAnimationFrame(orbe);

// ---- dados reais ----
async function voz(){
 try{const d=await j('/api/escuta-estado');Object.assign(D,d);render();telaPedida(d.tela)}
 catch(e){$('#est').textContent='Sem conexão';$('#estSub').textContent='Não consegui falar com o Braniac'}
}
async function painel(){
 try{const s=await j('/api/status'),ps=s.provedores||[],ok=ps.filter(p=>p.ok);
  $('#ias').textContent=ok.length+' / '+ps.length;$('#iasT').innerHTML=ps.slice(0,8).map(p=>'<em class="'+(p.ok?'on':'')+'">'+esc(p.nome)+'</em>').join('');
  const a=s.autonomia||{};$('#aut').textContent=a.armada?'Armada':'Desarmada';$('#autS').textContent=a.armada?'restam '+Math.round((a.restante_min||0)/60)+' h':'ações remotas pedem permissão';
  $('#sis').textContent=s.ligado?'Online':'Pausado';$('#sisS').textContent=s.jogo?('modo jogo: '+s.jogo):'Braniac ativo'}catch(e){}
 try{const c=await j('/api/b2/contas'),cons=['chatgpt','gemini','grok','deepseek'],xs=(c.contas||[]).filter(x=>cons.includes(x.nome)),okc=xs.filter(x=>x.aberta&&!x.precisa_login);
  $('#cons').textContent=okc.length+' / 4 prontos';$('#consT').innerHTML=xs.map(x=>'<em class="'+(x.aberta&&!x.precisa_login?'on':'')+'">'+esc(x.nome)+'</em>').join('')}catch(e){}
 try{const e=await j('/api/b2/estado');$('#hab').textContent=(e.skills||[]).length+' ativas';$('#habS').textContent=(e.skills||[]).slice(-2).map(s=>s.nome).join(' · ');
  $('#proj').textContent=(e.projetos||[]).length+' / '+(e.conversas||[]).length}catch(e){}
}
async function temp(){try{const t=await j('/api/termico');if(!t.pronto)return;
 const e=$('#sisT');e.textContent=(t.gpu_c?'GPU '+Math.round(t.gpu_c)+'°C':'GPU —')+(t.cpu_c?' · CPU '+Math.round(t.cpu_c)+'°C':' · CPU '+Math.round(t.cpu_pct)+'%')+' · RAM '+Math.round(t.ram_pct)+'%';
 e.style.color=t.quente||t.gpu_c>=80?'#ff5a4a':t.gpu_c>=70?'#f2a541':''}catch(x){}}
function relogio(){const d=new Date();$('#hora').textContent=d.toLocaleTimeString('pt-BR');$('#data').textContent=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'})}

// ---- botoes ----
async function acao(a){if(DEMO){demoAcao(a);return}try{await j('/api/escuta-acao',{acao:a})}catch(e){}}
$('#bAcordar').onclick=()=>acao('acordar');
$('#bDescansar').onclick=()=>acao('descansar');
$('#bMudo').onclick=async()=>{const m=!!(D.mudo||{}).mudo;if(DEMO){D.mudo={mudo:!m};render();return}try{await j('/api/mudo',{acao:m?'desmutar':'mutar'})}catch(e){}};
$('#bMic').onclick=()=>{if(D.estado==='parada'){acao('ligar');return}$('#conf').classList.add('aberto')};
$('#cNao').onclick=()=>$('#conf').classList.remove('aberto');
$('#cSim').onclick=()=>{$('#conf').classList.remove('aberto');acao('desligar')};

// ---- modo demo: estados simulados, nada toca no PC ----
const ROTEIRO=[['dormindo','idle'],['acordado','ouvindo'],['acordado','pensando'],['acordado','falando'],['dormindo','idle']];
let passo=0;
function demoAcao(a){if(a==='ligar'){D.estado='dormindo'}else if(a==='desligar'){D.estado='parada';D.atividade='idle'}else if(a==='acordar'){D.estado='acordado';D.atividade='idle'}else if(a==='descansar'){D.estado='dormindo';D.atividade='idle'}render()}
function demoCiclo(){
 const [e,a]=ROTEIRO[passo%ROTEIRO.length];passo++;D.estado=e;D.atividade=a;
 if(a==='ouvindo'){D.ultimo='quais projetos estão ativos?';D.historico=[['u','(simulado) quais projetos estão ativos?']]}
 if(a==='falando')D.historico=[['u','(simulado) quais projetos estão ativos?'],['j','(simulado) Você tem 3 projetos ativos.']];
 if(passo%ROTEIRO.length===0&&passo>5)D.mudo={mudo:!(D.mudo||{}).mudo};
 render()}
function demoVolume(){D.entrada=D.atividade==='ouvindo'?.05+.2*Math.abs(Math.sin(Date.now()/130)):0;D.fala=D.atividade==='falando'?.3+.5*Math.abs(Math.sin(Date.now()/170)):0}
relogio();setInterval(relogio,1000);
if(DEMO){
 $('#ias').textContent='5 / 6';$('#iasT').innerHTML='<em class="on">groq</em><em class="on">gemini</em><em>local</em>';

 $('#proj').textContent='4 / 12';$('#sis').textContent='Online';$('#sisS').textContent='Braniac ativo (simulado)';$('#sisT').textContent='GPU 62°C · CPU 35% · RAM 58%';
 $('#nome').insertAdjacentHTML('afterend','<span class="sim">SIMULADO</span>');
 render();setInterval(demoCiclo,3000);setInterval(()=>{demoVolume();render()},120);

 voz();setInterval(()=>{if(!document.hidden)voz()},150);painel();setInterval(painel,20000);temp();setInterval(temp,10000);
}

[package]
name = "braniac"
version = "0.1.0"
description = "BRANIAC - assistente de IA pessoal"
authors = ["Carlos Lavigne"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

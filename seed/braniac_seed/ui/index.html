<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRANIAC · Instalação</title>
<style>
  :root{--bg:#05070d;--painel:#0d1322;--linha:#1d2740;--texto:#e9eef9;--mudo:#8c9ab8;--ouro:#f0c75e;--azul:#4cc3ff;--verde:#3ddc97;--verm:#ff6b6b}
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{background:radial-gradient(1200px 700px at 20% 0%,#0c1630 0%,var(--bg) 60%);color:var(--texto);font:15px/1.5 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--linha)}
  header b{letter-spacing:.2em;color:var(--ouro)} header span{color:var(--mudo);font-size:13px}
  #passos{display:flex;gap:6px;margin-left:auto}
  #passos i{width:26px;height:5px;border-radius:3px;background:var(--linha)} #passos i.feito{background:var(--azul)} #passos i.atual{background:var(--ouro)}
  main{flex:1;display:grid;grid-template-columns:340px 1fr;min-height:0}
  #lado{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;border-right:1px solid var(--linha);padding:20px}
  canvas{width:260px;height:260px}
  #fala{min-height:64px;text-align:center;color:var(--mudo);font-size:14px;max-width:290px}
  #conteudo{overflow:auto;padding:30px 44px}
  h1{margin:0 0 6px;font-size:26px} h2{margin:22px 0 8px;font-size:16px;color:var(--ouro)} p{margin:6px 0;color:#c7d1e8}
  .mudo{color:var(--mudo);font-size:13px}
  .cartoes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:16px 0}
  .cartao{background:var(--painel);border:1px solid var(--linha);border-radius:14px;padding:16px;cursor:pointer;transition:.15s}
  .cartao:hover{border-color:var(--azul)} .cartao.sel{border-color:var(--ouro);box-shadow:0 0 0 1px var(--ouro) inset}
  .cartao h3{margin:0 0 6px;font-size:16px} .cartao p{font-size:13px;margin:0}
  .linha{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
  button{background:var(--azul);color:#04101c;border:0;border-radius:10px;padding:10px 18px;font:600 14px inherit;cursor:pointer}
  button.sec{background:transparent;color:var(--texto);border:1px solid var(--linha)} button:disabled{opacity:.4;cursor:not-allowed}
  button.perigo{background:var(--verm);color:#2a0606}
  input[type=text],input[type=password],textarea{width:100%;background:#0a0f1c;border:1px solid var(--linha);color:var(--texto);border-radius:10px;padding:10px 12px;font:inherit}
  .ok{color:var(--verde)} .erro{color:var(--verm)} .aviso{background:#241d08;border:1px solid #5a4a14;color:#f3dc8a;border-radius:12px;padding:12px 14px;font-size:13.5px;margin:12px 0}
  .perm{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--linha)} .perm.filho{margin-left:30px}
  .perm input{margin-top:5px} .risco{font-size:11px;border-radius:6px;padding:1px 7px;margin-left:6px}
  .risco.baixo{background:#0f3a2a;color:var(--verde)} .risco.medio{background:#3a3210;color:var(--ouro)} .risco.alto{background:#3a1414;color:var(--verm)}
  .barra{height:10px;border-radius:6px;background:var(--linha);overflow:hidden;margin:10px 0} .barra div{height:100%;background:linear-gradient(90deg,var(--azul),var(--verde));width:0;transition:.3s}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0} .chip{border:1px solid var(--linha);background:var(--painel);padding:6px 14px;border-radius:999px;cursor:pointer}
  .chip:hover{border-color:var(--ouro)}
  .bandeja{display:flex;gap:10px;align-items:center;background:#111a2e;border:1px solid var(--linha);border-radius:8px;padding:8px 12px;margin-top:10px;width:max-content}
  .bandeja i{display:block;width:16px;height:16px;border-radius:4px;background:var(--linha)} .bandeja i.eu{background:var(--ouro);border-radius:50%}
  footer{display:flex;justify-content:space-between;padding:14px 44px;border-top:1px solid var(--linha)}
  .prov{background:var(--painel);border:1px solid var(--linha);border-radius:14px;padding:14px;margin:10px 0}
  .prov.valida{border-color:var(--verde)} .prov h3{margin:0;font-size:15px} .prov a{color:var(--azul)}
  pre{white-space:pre-wrap;background:#0a0f1c;border:1px solid var(--linha);border-radius:10px;padding:12px;font:13px/1.5 inherit;max-height:230px;overflow:auto}
</style>
</head>
<body>
<header><b>BRANIAC</b><span>Instalação do seu assistente</span><div id="passos"></div></header>
<main>
  <aside id="lado"><canvas id="orbe" width="520" height="520"></canvas><div id="fala"></div><div id="modoVoz" class="mudo" style="text-align:center"></div><button class="sec" id="bMudo" title="Ligar ou desligar a voz do assistente">🔊 Voz do assistente: ligada</button></aside>
  <section id="conteudo"></section>
</main>
<footer><button class="sec" id="bVoltar">← Voltar</button><button id="bProximo">Continuar →</button></footer>

<script>
const $ = s => document.querySelector(s);
const el = (t, props = {}, ...filhos) => { const e = Object.assign(document.createElement(t), props); filhos.flat().forEach(f => e.append(f)); return e; };
let S = null, etapa = 'boas_vindas', voz = true, nivelMic = 0, falando = false, poll = null;

function aviso(msg) {
  let b = document.querySelector('#toast');
  if (!b) { b = el('div', { id: 'toast', style: 'position:fixed;left:50%;transform:translateX(-50%);bottom:76px;background:#3a1414;border:1px solid var(--verm);color:#ffd6d6;padding:10px 16px;border-radius:10px;max-width:80%;z-index:9;font-size:13.5px' }); document.body.append(b); }
  b.textContent = '⚠️ ' + msg; b.style.display = 'block'; clearTimeout(b._t); b._t = setTimeout(() => b.style.display = 'none', 10000);
  fetch('/api/log', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ msg: String(msg).slice(0, 400), etapa }) }).catch(() => {});
}
window.addEventListener('unhandledrejection', e => aviso('Algo não saiu como esperado: ' + ((e.reason && e.reason.message) || e.reason)));
window.addEventListener('error', e => aviso('Erro na tela: ' + e.message));

async function api(caminho, corpo) {
  const r = await fetch(caminho, corpo === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) });
  const d = await r.json(); if (d.erro) throw new Error(d.erro); return d;
}
async function recarregar() { S = await api('/api/estado'); return S; }

// ---------- voz do assistente (sintese do navegador, 100% local) ----------
function escolherVoz() {
  const vs = speechSynthesis.getVoices().filter(v => /pt[-_]BR/i.test(v.lang));
  const fem = /francisca|maria|luciana|vit[oó]ria|thalita|female|feminina/i, mas = /antonio|ant[oô]nio|daniel|felipe|male|masculin/i;
  const g = S?.perfil?.voz || window.vozEscolhida;
  return (g === 'masculina' ? vs.find(v => mas.test(v.name)) : g === 'feminina' ? vs.find(v => fem.test(v.name)) : null) || vs[0] || null;
}
let seq = 0, audioAtual = null;
function pararVoz() { speechSynthesis.cancel(); if (audioAtual) { audioAtual.pause(); audioAtual = null; } falando = false; }
function falarRobotico(texto) {
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(texto); u.lang = 'pt-BR'; u.rate = 1.02;
  const v = escolherVoz(); if (v) u.voice = v;
  if ((S?.perfil?.voz || window.vozEscolhida) === 'masculina') u.pitch = 0.85;
  u.onstart = () => falando = true; u.onend = u.onerror = () => falando = false;
  speechSynthesis.speak(u);
}
const corpoVoz = texto => JSON.stringify({ texto, genero: window.vozEscolhida || S?.perfil?.voz || 'feminina', voz: window.vozNome || S?.voz?.nome || null, estilo: window.vozEstilo || S?.voz?.estilo || 'calmo' });
async function falar(texto) {
  const minha = ++seq; $('#fala').textContent = texto; pararVoz();
  if (!voz) return;
  if (S?.voz?.nuvem && !(window.vozPausadaAte > Date.now())) {   // voz natural, vinda do servico de IA da pessoa (cache local: falas repetidas nao gastam cota)
    const modo = $('#modoVoz'); modo.textContent = '⏳ Gerando a minha voz natural…';
    try {
      const r = await fetch('/api/voz', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: corpoVoz(texto) });
      if (minha !== seq) return;
      if (r.ok && (r.headers.get('content-type') || '').includes('audio')) {
        const blob = await r.blob(); if (minha !== seq) return;
        const a = new Audio(URL.createObjectURL(blob)); audioAtual = a; a.onplay = () => falando = true; a.onended = a.onerror = () => falando = false;
        try { await a.play(); window.vozMotivo = null; indicarVoz(); return; }
        catch (e) { window.vozMotivo = 'bloqueada'; indicarVoz(); document.addEventListener('click', () => { if (audioAtual === a) a.play().catch(() => {}); }, { once: true }); return; }
      }
      const d = await r.json().catch(() => ({})); window.vozMotivo = d.motivo || 'outro';
      if (d.motivo === 'cota') window.vozPausadaAte = Date.now() + 5 * 60 * 1000;      // sem cota: nao insiste por 5 min
    } catch (e) { window.vozMotivo = 'rede'; }
    indicarVoz();
    if (minha !== seq) return;
    if (!S.voz.reserva) return;      // com a chave conectada nao troca para a voz robotica sem a pessoa pedir: fica o texto e o motivo
  }
  falarRobotico(texto);
}
function indicarVoz() {
  const m = window.vozMotivo, e = $('#modoVoz');
  e.textContent = S.voz.privada ? '🔒 Voz do sistema (modo privado)' :
    !S.voz.nuvem ? '🤖 Voz robótica · conecte uma chave de API' :
    m === 'cota' ? '🔇 Voz natural sem cota por alguns minutos (mais chaves = mais voz). ' + (S.voz.reserva ? 'Usando a voz do sistema.' : 'Leia o texto ao lado.') :
    m === 'lento' ? '🔇 A voz natural demorou demais desta vez. ' + (S.voz.reserva ? 'Usei a voz do sistema.' : 'Leia o texto ao lado.') :
    m === 'rede' ? '🔇 Sem conexão com a voz natural. ' + (S.voz.reserva ? 'Usei a voz do sistema.' : 'Leia o texto ao lado.') :
    m === 'bloqueada' ? '🔊 Clique na tela uma vez para ouvir a voz natural' :
    m ? '🔇 A voz natural falhou agora. ' + (S.voz.reserva ? 'Usei a voz do sistema.' : 'Leia o texto ao lado.') : '✨ Voz natural (serviço de IA)';
}
$('#bMudo').onclick = () => { voz = !voz; if (!voz) speechSynthesis.cancel(); $('#bMudo').textContent = '🔊 Voz do assistente: ' + (voz ? 'ligada' : 'desligada'); };

// ---------- orbe ----------
const cv = $('#orbe'), cx = cv.getContext('2d'); let t = 0;
function orbe() {
  t += 0.03; const w = 520, h = 520, c = w / 2, e = falando ? 0.55 + 0.35 * Math.sin(t * 9) : Math.min(1, nivelMic * 6);
  cx.clearRect(0, 0, w, h);
  for (let i = 0; i < 4; i++) {
    cx.beginPath();
    for (let a = 0; a <= 6.3; a += 0.06) {
      const r = 120 + i * 14 + (8 + e * 26) * Math.sin(a * (3 + i) + t * (1.5 + i * .4)) + 4 * Math.sin(a * 7 - t * 2);
      cx[a ? 'lineTo' : 'moveTo'](c + r * Math.cos(a), c + r * Math.sin(a));
    }
    cx.closePath(); cx.strokeStyle = `rgba(${i % 2 ? '240,199,94' : '76,195,255'},${.75 - i * .15})`; cx.lineWidth = 2.2; cx.stroke();
  }
  const g = cx.createRadialGradient(c, c, 5, c, c, 120); g.addColorStop(0, `rgba(240,199,94,${.35 + e * .4})`); g.addColorStop(1, 'rgba(76,195,255,0)');
  cx.fillStyle = g; cx.beginPath(); cx.arc(c, c, 120, 0, 6.3); cx.fill();
  requestAnimationFrame(orbe);
}
orbe();

// ---------- microfone (so mede o nivel para o teste; nada e gravado) ----------
async function testarMic(botao, saida) {
  try {
    const st = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ac = new AudioContext(), an = ac.createAnalyser(), buf = new Uint8Array(an.fftSize); ac.createMediaStreamSource(st).connect(an);
    let pico = 0; const fim = Date.now() + 5000;
    const iv = setInterval(() => {
      an.getByteTimeDomainData(buf); let m = 0; for (const b of buf) m = Math.max(m, Math.abs(b - 128) / 128); nivelMic = m; pico = Math.max(pico, m);
      saida.textContent = `Fale algo… nível: ${'█'.repeat(Math.round(m * 30))}`;
      if (Date.now() > fim) { clearInterval(iv); st.getTracks().forEach(x => x.stop()); nivelMic = 0;
        saida.className = pico > 0.04 ? 'ok' : 'erro'; saida.textContent = pico > 0.04 ? 'Microfone funcionando. Ouvi você bem.' : 'Quase não ouvi nada. Aproxime-se do microfone ou escolha outro nas configurações do Windows.'; }
    }, 80);
  } catch (e) { saida.className = 'erro'; saida.textContent = 'Não consegui usar o microfone: autorize o acesso quando o Windows perguntar.'; }
}

// ---------- telas ----------
const TELAS = {};
const ORDEM = () => S.etapas.filter(e => e !== 'concluido');

TELAS.boas_vindas = () => {
  const s = el('span', { className: 'mudo' });
  return [el('h1', {}, 'Vamos criar o seu assistente'),
    el('p', {}, 'Em poucos minutos você terá uma IA pessoal que conversa por voz, lembra do que importa e, se você quiser, ajuda no seu PC.'),
    el('div', { className: 'aviso' }, '🔒 Tudo roda e fica no SEU computador. Nenhuma informação sua é enviada para nós nem para ninguém. As atualizações só trazem novas funções, de mão única.'),
    el('div', { className: 'aviso' }, '🤖 Minha voz está robótica agora porque ainda não conectei nenhuma API de IA. Na próxima etapa eu te ensino, passo a passo, a pegar uma chave gratuita. Assim que ela estiver conectada, minha voz passa a vir do serviço de IA e fica natural. E quanto mais chaves você conectar, melhor.'),
    el('div', { className: 'linha' }, el('button', { onclick: () => { etapa = 'chaves'; render(); } }, '🔑 Ver como conseguir minha chave (passo a passo)')),
    el('h2', {}, 'Canais para falar com o seu assistente (opcionais)'),
    el('p', { className: 'mudo' }, 'Nenhum deles é obrigatório: você pode configurar agora, depois, ou nunca.'),
    el('div', { className: 'cartoes' },
      el('div', { className: 'cartao', onclick: () => { etapa = S.perfil.consentimento_acesso_pc ? 'remoto' : 'consentimento'; render(); } }, el('h3', {}, '💬 WhatsApp'), el('p', {}, 'O assistente lê e responde suas mensagens, só com a sua permissão.'), el('p', { className: 'mudo' }, 'Opcional · vem logo depois da escolha de acesso →')),
      el('div', { className: 'cartao', onclick: () => { etapa = S.perfil.consentimento_acesso_pc ? 'remoto' : 'consentimento'; render(); } }, el('h3', {}, '✈️ Telegram'), el('p', {}, 'Mande comandos para o seu PC de qualquer lugar, falando com o seu próprio bot.'), el('p', { className: 'mudo' }, 'Opcional · vem logo depois da escolha de acesso →'))),
    el('h2', {}, 'O que vamos fazer'),
    el('p', {}, '1. Você pega ao menos uma chave de IA gratuita (eu ensino).  2. Escolhe o que o assistente pode acessar no PC (pode ser nada).  3. WhatsApp e Telegram (opcional).  4. Preparamos a IA local.  5. Conecta o ChatGPT e o Gemini (opcional).  6. Dá um nome e uma voz ao assistente.'),
    el('h2', {}, 'Teste do microfone'),
    el('div', { className: 'linha' }, el('button', { className: 'sec', onclick: e => testarMic(e.target, s) }, '🎙 Testar microfone (5 s)'), s)];
};

TELAS.consentimento = () => {
  const modo = S.perfil.consentimento_acesso_pc;
  const cart = (id, tit, txt) => el('div', { className: 'cartao' + (modo === id ? ' sel' : ''), onclick: async () => {
      if (id === 'granular') { await api('/api/consentimento', { modo: 'granular' }); } else { await api('/api/consentimento', { modo: id }); }
      await recarregar(); render(); } }, el('h3', {}, tit), el('p', {}, txt));
  const lista = el('div');
  if (modo === 'granular') {
    lista.append(el('h2', {}, 'Escolha item por item'), el('p', { className: 'mudo' }, 'Liberar uma permissão libera só ela. Desmarcar uma categoria desmarca tudo que está dentro dela.'));
    S.permissoes.forEach(p => {
      const filho = p.chave.includes('.');
      lista.append(el('label', { className: 'perm' + (filho ? ' filho' : '') },
        el('input', { type: 'checkbox', checked: p.liberada, onchange: async e => { await api('/api/permissao', { chave: p.chave, ativo: e.target.checked }); await recarregar(); render(); } }),
        el('div', {}, el('b', {}, p.titulo), el('span', { className: 'risco ' + p.risco }, 'risco ' + p.risco), el('div', { className: 'mudo' }, p.descricao))));
    });
  }
  return [el('h1', {}, 'O que o assistente pode fazer no seu PC?'),
    el('div', { className: 'aviso' }, 'Para ajudar de verdade (abrir programas, ler arquivos, usar e-mail, WhatsApp, Spotify…), o assistente precisa de permissão no seu computador. Você decide agora e pode mudar quando quiser, até por voz. Cada permissão é separada e revogável, e existe um botão de emergência que desliga tudo.'),
    el('div', { className: 'cartoes' },
      cart('total', '✅ Acesso total', 'O assistente pode usar tudo que está na lista: arquivos, programas, navegador, e-mail, WhatsApp, Spotify.'),
      cart('granular', '🎚 Escolher item por item', 'Você marca exatamente o que libera. Recomendado.'),
      cart('nenhum', '🚫 Nenhum acesso', 'O assistente só conversa. Não toca em nada no PC. Dá para liberar depois.')),
    modo ? el('p', { className: 'ok' }, '✔ Você escolheu: ' + ({ total: 'acesso total', granular: 'escolher item por item', nenhum: 'nenhum acesso' }[modo]) + '. Pode continuar (ou mudar a escolha acima).') :
           el('p', { className: 'erro' }, '👆 Para continuar, clique em UMA das três opções acima (pode ser “Nenhum acesso”).'),
    lista,
    modo ? el('div', { className: 'linha' }, el('button', { className: 'perigo', onclick: async () => { await api('/api/emergencia', {}); await recarregar(); render(); } }, '⛔ Revogar tudo agora')) : ''];
};

TELAS.hardware = () => {
  const out = el('div'), prog = el('div');
  const mostrar = async () => {
    const h = await api('/api/hardware', {}); await recarregar();
    out.replaceChildren(el('p', {}, `Seu PC: ${h.info.ram_gb} GB de memória, ${h.info.cpus} núcleos, ${h.info.gpu ? 'placa de vídeo ' + h.info.gpu.nome + ' (' + h.info.gpu.vram_gb + ' GB)' : 'sem placa de vídeo dedicada'}, ${h.info.disco_livre_gb} GB livres.`),
      el('p', { className: 'ok' }, `Recomendado: ${h.detalhe.titulo} — ${h.motivo}.`),
      el('div', { className: 'cartoes' }, ...Object.entries(S.perfis_ia).map(([id, p]) => el('div', { className: 'cartao' + (S.perfil.perfil_ia === id ? ' sel' : ''), onclick: async () => { await api('/api/perfil-ia', { perfil: id }); await recarregar(); render(); } },
        el('h3', {}, p.titulo), el('p', {}, p.descricao), el('p', { className: 'mudo' }, `Modelo ${p.ollama} · baixa ≈ ${p.download_gb} GB`)))));
    const d = await api('/api/dependencias', {});
    const info = el('p', { className: d.modelo_pronto ? 'ok' : 'mudo' }, d.modelo_pronto ? '✔ IA local já está pronta neste PC.' :
      !d.ollama_instalado ? 'O Ollama (motor da IA local) ainda não está instalado. Baixe o instalador oficial pelo botão abaixo (você confirma a instalação), depois volte aqui e toque em “Verificar de novo”. Você também pode pular e usar só as chaves de IA.' : 'A IA local ainda não foi baixada.');
    out.append(info);
    if (!d.ollama_instalado) out.append(el('div', { className: 'linha' },
      el('button', { onclick: async e => { e.target.disabled = true; await api('/api/ollama/instalar', {}); acompanhar('ollama_instalador', prog); } }, '⬇ Baixar e abrir o instalador do Ollama'),
      el('button', { className: 'sec', onclick: () => { out.replaceChildren(); mostrar(); } }, 'Verificar de novo')));
    if (d.ollama_instalado && !d.modelo_pronto) out.append(el('button', { onclick: async e => { e.target.disabled = true; await api('/api/dependencias/instalar', {}); acompanhar('dependencias', prog); } }, 'Baixar a IA local agora'));
    out.append(prog);
  };
  mostrar();
  return [el('h1', {}, 'Preparando a IA local'), el('p', {}, 'Tudo começa funcionando só no seu computador. Escolhi o perfil pelo seu hardware; os modelos são baixados agora, não vêm no instalador.'), out];
};

function acompanhar(job, alvo) {
  clearInterval(poll);
  poll = setInterval(async () => {
    await recarregar(); const j = S.jobs[job]; if (!j) return;
    alvo.replaceChildren(el('div', { className: 'barra' }, el('div', { style: `width:${j.pct}%` })), el('p', { className: j.estado === 'erro' ? 'erro' : 'mudo' }, (j.estado === 'ok' ? '✔ Pronto.' : j.texto || '')));
    if (j.estado !== 'rodando') clearInterval(poll);
  }, 1200);
}

TELAS.chaves = () => {
  const tem = S.chaves.length > 0, nv = S.nivel, caixa = el('div');
  const cartao = p => {
    const ok = S.chaves.includes(p.id), msg = el('span', { className: 'mudo' }), campo = el('input', { type: 'password', placeholder: 'Cole a chave aqui (' + p.formato + ')' });

          el('button', { className: 'perigo', onclick: async () => { if (confirm('Remover o Telegram e esquecer o dono?')) { await api('/api/telegram/remover', {}); await recarregar(); desenharTg(); } } }, 'Remover Telegram')));
    }
    caixa.append(el('div', { className: 'aviso' }, 'Como funciona a segurança: só o ID do seu Telegram é atendido; o controle do PC só funciona ARMADO (e só você arma, aqui no computador); cada ação respeita as permissões que você liberou; ações perigosas (apagar, escrever, rodar comandos, enviar WhatsApp) pedem um código de confirmação; /parar desarma tudo na hora. Textos e prints passam pelos servidores do Telegram.'));
    tg.replaceChildren(caixa);
  };
  // ---- iniciar com o Windows ----
  auto.append(el('label', { className: 'perm' }, el('input', { type: 'checkbox', checked: S.autostart, onchange: async e => { const x = await api('/api/autostart', { ativo: e.target.checked }); if (!x.ok) { e.target.checked = !e.target.checked; alert(x.motivo); } } }),
    el('div', {}, el('b', {}, 'Iniciar com o Windows'), el('div', { className: 'mudo' }, 'Abre escondido na bandeja ao ligar o PC, para o Telegram funcionar sempre. Fechar a janela só a esconde: o assistente continua na bandeja (clique com o botão direito no ícone para sair).'))));
  desenharWa(); desenharTg(); clearInterval(poll); poll = setInterval(desenharWa, 4000);
  return [el('h1', {}, 'WhatsApp e controle remoto'), el('p', {}, 'Opcional. Conecte o WhatsApp e/ou o seu bot do Telegram para o assistente trabalhar por você mesmo quando você estiver longe do PC.'), wa, tg, auto];
};

TELAS.icone = () => {
  const cart = (id, t, d, mock) => el('div', { className: 'cartao' + (S.perfil.modo_icone === id ? ' sel' : ''), onclick: async () => { await api('/api/icone', { modo: id }); await recarregar(); render(); } }, el('h3', {}, t), el('p', {}, d), mock);
  return [el('h1', {}, 'Onde fica o ícone do assistente?'), el('p', {}, 'Para chamar, dar um duplo clique ou fazer ele voltar quando você estiver jogando ou editando.'),
    el('div', { className: 'cartoes' },
      cart('bandeja', '📌 Na bandeja do Windows', 'Junto dos outros ícones perto do relógio. Discreto.', el('div', { className: 'bandeja' }, el('i'), el('i'), el('i', { className: 'eu' }), el('i'), el('span', { className: 'mudo' }, '14:32'))),
      el('div', { className: 'cartao', style: 'opacity:.5;cursor:not-allowed' }, el('h3', {}, '🔮 Flutuante na tela (em breve)'), el('p', {}, 'Uma bolinha que você arrasta para onde quiser. Ainda não está disponível nesta versão.'))),
    el('div', { className: 'aviso' }, 'Modo jogo e edição: clique em “🎮 Modo jogo” na tela do assistente (ou diga “modo jogo”) e ele se suspende e se esconde na bandeja, sem responder nem agir. Para reativar, clique no ícone da bandeja e dê dois cliques no orbe. (Detectar jogos sozinho: em breve.)')];
};

// leva ao passo certo para cada pendencia (antes a pessoa ficava presa na tela final, sem botao e sem Voltar)
function passoQueFalta(texto) { return /acesso ao PC/i.test(texto) ? 'consentimento' : /chave/i.test(texto) ? 'chaves' : /nome|voz/i.test(texto) ? 'nome_voz' : 'boas_vindas'; }

TELAS.concluido = () => {
  const p = S.perfil, msg = el('p');
  const falta = S.faltando;
  return [el('h1', {}, falta.length ? 'Quase lá' : `${p.nome_assistente} está pronto`),
    ...(falta.length ? [el('div', { className: 'linha', style: 'flex-direction:column;align-items:flex-start;gap:8px' }, ...falta.map(f => el('button', { className: 'sec', onclick: () => { etapa = passoQueFalta(f); render(); } }, '→ ' + f.charAt(0).toUpperCase() + f.slice(1))))] : []),
    el('p', {}, falta.length ? 'Clique em uma das opções acima para resolver. Depois volte aqui e conclua.' : `Voz ${p.voz}, acesso ao PC: ${p.consentimento_acesso_pc}, ícone: ${p.modo_icone === 'bandeja' ? 'na bandeja' : 'flutuante'}.`),
    falta.length ? '' : el('div', { className: 'aviso' }, `Para falar com ${p.nome_assistente}: abra o ícone da bandeja (junto do relógio) e use o microfone ou escreva. “Pode descansar” esconde a janela; “modo jogo” suspende o assistente. (Chamar só falando “${p.nome_assistente}, tá acordado?” ainda não está disponível.) A partir de agora só o assistente gerencia as contas e o navegador dele; você só os vê se pedir.`),
    S.perfil.concluido ? el('div', { className: 'linha' }, el('button', { className: 'sec', onclick: () => location.replace('/') }, '← Voltar ao assistente')) : '',
    el('div', { className: 'linha' }, el('button', { disabled: !!falta.length, onclick: async () => { const r = await api('/api/concluir', {}); if (r.ok) { msg.className = 'ok'; msg.textContent = 'Instalação concluída! Abrindo o seu assistente…'; falar(`Tudo pronto. Eu sou ${p.nome_assistente}. Vamos conversar!`); setTimeout(() => location.replace('/'), 3200); } else { msg.className = 'erro'; msg.textContent = r.motivo; } } }, '🚀 Concluir e começar'), msg)];
};

const FALAS = {
  boas_vindas: 'Olá! Minha voz está robótica porque ainda não foi conectada nenhuma API de inteligência artificial. Na próxima etapa eu ensino, passo a passo, como conseguir uma chave gratuita. Depois disso a minha voz fica natural. E quanto mais chaves, melhor. Você também pode conectar o WhatsApp e o Telegram, se quiser.',
  consentimento: 'Agora uma decisão importante: o que eu posso fazer no seu computador? Você escolhe, e pode mudar sempre que quiser.',
  hardware: 'Vou olhar o seu computador para escolher a melhor inteligência local.',
  chaves: 'Vamos pegar a sua primeira chave. Eu explico cada passo. Comece pela do Google: além das respostas, ela liga a minha voz natural.',
  ias_nuvem: 'Agora você pode entrar nas suas contas do ChatGPT e do Gemini. Elas me ajudam a conhecer você.',
  reuniao_inicial: 'Vou reunir as inteligências para elas me contarem o que sabem sobre você.',
  nome_voz: 'Chegou a hora de me dar um nome. Escolha a voz e o nome que mais combinam com você.',
  integracoes: 'Conte como você quer me usar: e-mail, música, mensagens…',
  remoto: 'Se quiser, conecte o WhatsApp e o Telegram. Com o Telegram você me manda comandos de qualquer lugar, com segurança.',
  icone: 'Onde você prefere me deixar: na bandeja ou flutuando na tela?',
  concluido: 'Está tudo pronto!'
};

async function render() {
  clearInterval(poll); window.antesDeAvancar = null;
  if (!S) await recarregar();
  const ord = ORDEM(), i = etapa === 'concluido' ? ord.length : ord.indexOf(etapa);
  $('#passos').replaceChildren(...ord.map((e, k) => el('i', { className: k < i ? 'feito' : k === i ? 'atual' : '' })));
  let conteudo;
  try { conteudo = [].concat(TELAS[etapa]()).filter(Boolean); }
  catch (e) { aviso('Erro ao montar esta etapa: ' + e.message); conteudo = [el('h1', {}, 'Ops'), el('p', {}, 'Não consegui montar esta etapa (' + e.message + '). Use Voltar ou Continuar para seguir.')]; }
  const mesma = window._ultimaEtapa === etapa, rolagem = $('#conteudo').scrollTop; window._ultimaEtapa = etapa;
  $('#conteudo').replaceChildren(...conteudo);
  $('#conteudo').scrollTop = mesma ? rolagem : 0;     // marcar uma permissao nao joga a tela para o topo
  indicarVoz();
  const opc = (S.opcionais || []).includes(etapa), h1 = $('#conteudo h1');
  if (h1 && opc) h1.append(el('span', { className: 'risco medio', style: 'font-size:12px;margin-left:10px;vertical-align:middle' }, 'opcional'));
  $('#bProximo').textContent = opc ? 'Pular ou continuar →' : 'Continuar →';
  $('#bVoltar').style.visibility = i > 0 ? 'visible' : 'hidden';
  $('#bProximo').style.display = etapa === 'concluido' ? 'none' : '';
  $('#bProximo').disabled = (etapa === 'chaves' && !S.chaves.length) || (etapa === 'consentimento' && !S.perfil.consentimento_acesso_pc);
  $('#bProximo').title = etapa === 'chaves' && !S.chaves.length ? 'Coloque pelo menos uma chave válida' : etapa === 'consentimento' && !S.perfil.consentimento_acesso_pc ? 'Escolha uma opção (pode ser nenhum acesso)' : '';
  api('/api/etapa', { etapa }).catch(() => {});
  const pular = window.pularFala; window.pularFala = false;      // depois de conectar a chave eu falo UMA frase propria (nao gasta cota com a fala padrao da etapa)
  if (FALAS[etapa] && !pular && !(etapa === 'nome_voz' && S.perfil.nome_assistente)) falar(FALAS[etapa]);
}
async function ir(delta) {
  try {
  if (delta > 0 && window.antesDeAvancar && !(await window.antesDeAvancar())) return;
  await recarregar(); const ord = ORDEM(), i = (etapa === 'concluido' ? ord.length : ord.indexOf(etapa)) + delta;
  etapa = i >= ord.length ? 'concluido' : ord[Math.max(0, i)]; render();
  } catch (e) { aviso('Não consegui avançar: ' + e.message); }
}
$('#bProximo').onclick = () => ir(1); $('#bVoltar').onclick = () => ir(-1);
speechSynthesis.onvoiceschanged = () => {};
(async () => { await recarregar(); etapa = S.perfil.concluido ? 'concluido' : (S.perfil.etapa || 'boas_vindas'); if (!S.etapas.includes(etapa)) etapa = 'boas_vindas';
  if (etapa === 'concluido' && !S.perfil.concluido && S.faltando.length) etapa = passoQueFalta(S.faltando[0]); render(); })();
</script>
